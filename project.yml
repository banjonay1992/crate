# XcodeGen spec for Crate. Generate the project with `xcodegen generate`.
# The .xcodeproj is not committed; this file is the source of truth.
name: Crate

options:
  bundleIdPrefix: uk.co.nayproductions
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en-GB

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

packages:
  CrateCore:
    path: Packages/CrateCore

targets:
  Crate:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.nayproductions.crate
        PRODUCT_NAME: Crate
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: CrateCore
        product: CrateCore

schemes:
  Crate:
    build:
      targets:
        Crate: all
    run:
      config: Debug
    archive:
      config: Release
